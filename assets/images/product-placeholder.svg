<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="KeyGuard drive placeholder">
  <defs>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.35" stop-color="#B04CFF"/>
      <stop offset="0.7" stop-color="#FF3BD4"/>
      <stop offset="1" stop-color="#39FF88"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#07080C"/>
  <!-- drive body -->
  <rect x="110" y="70" width="180" height="150" rx="14" fill="#10131B" stroke="url(#rgb)" stroke-width="3"/>
  <!-- USB-C plug -->
  <rect x="175" y="44" width="50" height="28" rx="6" fill="#171B26" stroke="#232838" stroke-width="2"/>
  <!-- keypad: 3 x 3 + 1 -->
  <g fill="#171B26" stroke="#B04CFF" stroke-width="1.5">
    <rect x="152" y="96" width="26" height="20" rx="4"/><rect x="187" y="96" width="26" height="20" rx="4"/><rect x="222" y="96" width="26" height="20" rx="4"/>
    <rect x="152" y="124" width="26" height="20" rx="4"/><rect x="187" y="124" width="26" height="20" rx="4"/><rect x="222" y="124" width="26" height="20" rx="4"/>
    <rect x="152" y="152" width="26" height="20" rx="4"/><rect x="187" y="152" width="26" height="20" rx="4"/><rect x="222" y="152" width="26" height="20" rx="4"/>
    <rect x="187" y="180" width="26" height="20" rx="4"/>
  </g>
  <!-- lock LED -->
  <circle cx="200" cy="208" r="5" fill="#FF3B5C"/>
  <text x="200" y="262" fill="#8C95A8" font-family="sans-serif" font-size="16" text-anchor="middle">Photo coming soon</text>
</svg>
