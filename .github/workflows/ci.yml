# Runs the code checker (ruff) and the unit tests on every pull request,
# so nothing broken can be merged into main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is created in foundation Prompt D; until then install the two tools directly
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: |
          code=0
          python -m pytest tests/unit -q || code=$?
          # Exit code 5 means "no tests collected": normal until the first tests are written (Prompt F)
          if [ "$code" -eq 5 ]; then echo "No unit tests yet - OK for now."; exit 0; fi
          exit "$code"
